name: Build Jukebox 2.2091 (Android64)

# Compila el mod Jukebox_2.2091.zip (que debe estar en la raiz del repo) para Android64 y GD 2.2091.
#
# Por que se cambio: el SDK 5.11.2 "release" es de GD 2.2081 y los bindings de 2.2091 piden cabeceras que ese SDK
# no tiene (Geode/mapping/*.hpp, CCTouchClipper.h, scrollWheel bool...). Parchear el SDK a mano no escala.
# La rama v6 de Geode ya esta adaptada a 2.2091, asi que se usa esa rama (SDK + bindings de main) y se compila
# tambien el loader de esa misma rama para tener el binario contra el que se enlaza el mod.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  GD_VERSION: "2.2091"
  GD_COMP_VERSION: "22091"
  GEODE_REF: "v6"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf jukebox_src
          mkdir jukebox_src
          unzip -q -o Jukebox_2.2091.zip -d jukebox_src
          test -f jukebox_src/mod.json || (echo "::error::No se encontro mod.json dentro del zip" && exit 1)

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Geode CLI profile
        run: |
          CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win

      - name: Clone Geode SDK (${{ env.GEODE_REF }})
        run: |
          git clone --depth 1 --branch "$GEODE_REF" --recurse-submodules --shallow-submodules \
            https://github.com/geode-sdk/geode "$GITHUB_WORKSPACE/geode-sdk-clone"
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk-clone" >> "$GITHUB_ENV"
          git -C geode-sdk-clone log -1 --format='Geode %h %ad %s' --date=short
          grep -n "android:" geode-sdk-clone/CMakeLists.txt | head -2

      - uses: actions/cache@v4
        with:
          path: cpm-cache
          key: cpm-jukebox-${{ hashFiles('geode-sdk-clone/CMakeLists.txt', 'jukebox_src/CMakeLists.txt') }}
          restore-keys: cpm-jukebox-

      # El mod se enlaza contra Geode.android64.so: se compila el loader de la misma rama.
      # (Directorio de build distinto de "build": el CMake del mod usa $GEODE_SDK/build para el SDK.)
      - name: Build Geode loader (link target)
        shell: bash
        run: |
          set -o pipefail
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd "$GEODE_SDK"
          cmake -B loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a \
            -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" 2>&1 | tee "$GITHUB_WORKSPACE/loader.log"
          cmake --build loader-build --parallel 2>&1 | tee -a "$GITHUB_WORKSPACE/loader.log"
          ls -la bin/nightly/Geode.android64.so

      - name: Build mod
        shell: bash
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd jukebox_src
          set +e
          {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Android64 \
              -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" \
            && cmake --build build --config Release --parallel -- -k 0
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Error compilando Jukebox"
              echo '```'
              grep -n -B1 -A14 -E 'FAILED:|error:|CMake Error|undefined reference|ld: error|fatal error' "$GITHUB_WORKSPACE/build.log" | head -150
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          find ./build -name "*.geode" -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          ls -la "$GITHUB_WORKSPACE/output"
          ls "$GITHUB_WORKSPACE"/output/*.geode > /dev/null

      - name: Upload build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-build-logs
          path: |
            build.log
            loader.log
          if-no-files-found: ignore

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-android64-2.2091
          path: output/*.geode
          if-no-files-found: error
